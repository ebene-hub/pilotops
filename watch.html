<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Live · Pilot Ops</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #0b0f17; color: #e5e9f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #app { display: flex; flex-direction: column; height: 100dvh; }
    header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid #1c2433; }
    header .brand { font-weight: 700; letter-spacing: -0.01em; }
    header .live { display: none; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #ef4444; }
    header .live.on { display: inline-flex; }
    header .live .dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; animation: pulse 1.5s infinite; }
    header .meta { margin-left: auto; font-size: 12px; color: #94a3b8; text-align: right; }
    main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 320px; gap: 12px; padding: 12px; }
    .videowrap { position: relative; background: #000; border-radius: 10px; overflow: hidden; display: grid; place-items: center; }
    video { width: 100%; height: 100%; object-fit: contain; background: #000; display: none; }
    .waiting { position: absolute; inset: 0; display: grid; place-items: center; color: #94a3b8; font-size: 13px; font-family: ui-monospace, monospace; }
    .waiting .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; margin-right: 8px; animation: pulse 1.5s infinite; vertical-align: middle; }
    .rec { position: absolute; top: 12px; left: 12px; display: none; align-items: center; gap: 6px; font-family: ui-monospace, monospace; font-size: 12px; font-weight: 700; text-shadow: 0 1px 2px rgba(0,0,0,.7); }
    .rec.on { display: flex; }
    .rec .dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; animation: pulse 1.5s infinite; }
    .chat { display: flex; flex-direction: column; min-height: 0; background: #0f1623; border: 1px solid #1c2433; border-radius: 10px; }
    .chat h3 { margin: 0; padding: 12px 14px; font-size: 13px; border-bottom: 1px solid #1c2433; }
    .chat .msgs { flex: 1; overflow-y: auto; padding: 10px 14px; display: flex; flex-direction: column; gap: 10px; }
    .msg .who { font-size: 12px; font-weight: 600; }
    .msg .who .time { color: #64748b; font-weight: 400; font-size: 10px; margin-left: 6px; font-family: ui-monospace, monospace; }
    .msg .text { font-size: 12.5px; color: #cbd5e1; line-height: 1.45; margin-top: 2px; }
    .chat .empty { color: #64748b; font-size: 12px; text-align: center; padding: 16px; }
    .err { margin: auto; text-align: center; color: #94a3b8; padding: 24px; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 240px; } }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <span class="brand">Pilot&nbsp;Ops</span>
      <span class="live" id="liveBadge"><span class="dot"></span>LIVE</span>
      <div class="meta" id="meta"></div>
    </header>
    <main id="main">
      <div class="videowrap">
        <video id="v" autoplay muted playsinline></video>
        <div class="rec" id="rec"><span class="dot"></span>REC</div>
        <div class="waiting" id="waiting"><span class="dot"></span>Connecting to feed…</div>
      </div>
      <div class="chat">
        <h3>Mission chat</h3>
        <div class="msgs" id="msgs"><div class="empty">No messages yet.</div></div>
      </div>
    </main>
  </div>
  <script type="module" src="/src/watch.js"></script>
</body>
</html>
