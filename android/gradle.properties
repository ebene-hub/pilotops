org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# ---- Deployment config (override per build; e.g. in ~/.gradle/gradle.properties
#      or with -P flags). These bake into BuildConfig. ----
SUPABASE_URL=https://your-domain
SUPABASE_ANON_KEY=replace-with-your-anon-key
# Host the controller pushes the RTMP stream to (usually your Pilot Ops domain).
STREAM_HOST=your-domain
# rtmp (default, port 1935) or srt (port 8890).
STREAM_SCHEME=rtmp
