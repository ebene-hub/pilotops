# MediaMTX — ingest the controller cast (RTMP/SRT) and redistribute it to the
# Pilot Ops browser as low-latency WebRTC (WHEP), with HLS fallback + recording.
#
# The stream path is the flight uuid. Every publish/read is authorised by the
# stream-gateway (it validates the Supabase JWT in the ?token= query against the
# flight + org). Recordings are picked up by the gateway and attached to the flight.

logLevel: info
logDestinations: [stdout]

###############################################
# Auth — delegate every action to stream-gateway
authMethod: http
authHTTPAddress: http://stream-gateway:9000/auth
# Internal/control actions don't need a user token.
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof

###############################################
# Control API (used for health checks only; not exposed publicly)
api: yes
apiAddress: :9997

###############################################
# Ingest — from the Android app
rtmp: yes
rtmpAddress: :1935
srt: yes
srtAddress: :8890

###############################################
# Playback — to the Pilot Ops browser
webrtc: yes
webrtcAddress: :8889
# Single UDP port multiplexes all WebRTC media; must be reachable from clients.
webrtcLocalUDPAddress: :8189
# Comma-separated public hostnames/IPs added to ICE candidates (set per deploy).
webrtcAdditionalHosts: []

hls: yes
hlsAddress: :8888
# Low-Latency HLS is the resilient fallback for viewers whose network blocks UDP
# /WebRTC or is too lossy for it (it rides TCP/HTTPS through Caddy). Tuned for a
# small delay while keeping ~7 short segments of headroom to ride out hiccups.
hlsVariant: lowLatency
hlsAlwaysRemux: yes
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms

###############################################
# Defaults applied to every path (= every flight)
pathDefaults:
  # Auto-recording is DISABLED for now — recordings are managed manually so video
  # volume/size stays under control (a long mission can produce 100s of MB and a
  # single t2.micro / Supabase free tier can't absorb that). Live casting (WebRTC
  # /WHEP) is unaffected; nothing is written to disk. Flip back to `record: yes`
  # (and pick a storage backend, e.g. S3) to re-enable automatic recording.
  # The stream-gateway still polls the MediaMTX API to flip flights offline.
  record: no
  recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordFormat: fmp4
  recordSegmentDuration: 24h

paths:
  all_others:
